name: Config (Ansible)

on:
  push:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/ansible.yml"]
  pull_request:
    paths: ["ansible/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar y ejecutar ansible-lint
        run: |
          pip install ansible-core==2.17.5 ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml
          cd ansible && ansible-lint playbook.yml

  deploy:
    name: Aplicar configuracion
    needs: lint
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: latest
    secrets: inherit
