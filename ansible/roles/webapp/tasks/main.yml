---
- name: Autenticar Docker contra ECR (usa el rol IAM de la instancia)
  ansible.builtin.shell: |
    set -o pipefail
    aws ecr get-login-password --region {{ webapp_aws_region }} | \
      docker login --username AWS --password-stdin {{ webapp_ecr_registry }}
  args:
    executable: /bin/bash
  changed_when: false

- name: Descargar la imagen de la aplicacion
  community.docker.docker_image:
    name: "{{ webapp_ecr_registry }}/{{ webapp_ecr_repository }}"
    tag: "{{ webapp_image_tag }}"
    source: pull
    force_source: true

- name: Ejecutar el contenedor de la aplicacion
  community.docker.docker_container:
    name: "{{ webapp_container_name }}"
    image: "{{ webapp_ecr_registry }}/{{ webapp_ecr_repository }}:{{ webapp_image_tag }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ webapp_host_port }}:{{ webapp_container_port }}"
    env:
      APP_ENV: "{{ webapp_app_env }}"
      APP_TEAM: "{{ webapp_app_team }}"

- name: Limpiar imagenes huerfanas
  community.docker.docker_prune:
    images: true
    images_filters:
      dangling: true

- name: Verificar que la aplicacion responde
  ansible.builtin.uri:
    url: "http://localhost:{{ webapp_host_port }}/health"
    status_code: 200
  register: webapp_health
  retries: 10
  delay: 3
  until: webapp_health.status == 200
  changed_when: false
