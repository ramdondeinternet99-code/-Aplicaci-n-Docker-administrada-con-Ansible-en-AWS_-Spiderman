---
- name: Instalar Docker y pip
  ansible.builtin.dnf:
    name:
      - docker
      - python3-pip
    state: present

- name: Instalar el SDK de Docker para Python (lo usa Ansible)
  ansible.builtin.pip:
    name: docker==7.1.0
    executable: pip3

- name: Configurar rotacion de logs de Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar docker

- name: Habilitar e iniciar Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Permitir a ec2-user usar Docker
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true
    
- name: Aplicar reinicio de Docker antes de desplegar la app
  ansible.builtin.meta: flush_handlers
