---
- name: Limpiar librerias conflictivas de pip en /usr/local si existen
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/lib/python3.9/site-packages/docker
    - /usr/local/lib/python3.9/site-packages/urllib3
    - /usr/local/lib/python3.9/site-packages/requests
    - /usr/local/lib64/python3.9/site-packages/docker
    - /usr/local/lib64/python3.9/site-packages/urllib3
    - /usr/local/lib64/python3.9/site-packages/requests

- name: Instalar Docker y el SDK de Docker para Python
  ansible.builtin.dnf:
    name:
      - docker
      - python3-docker
    state: present

- name: Configurar rotacion de logs de Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar docker

- name: Habilitar e iniciar Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Permitir a ec2-user usar Docker
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true

- name: Aplicar reinicio de Docker antes de desplegar la app
  ansible.builtin.meta: flush_handlers